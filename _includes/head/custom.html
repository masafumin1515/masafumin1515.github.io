{% include base_path %}

<!-- start custom head snippets -->

<!-- The same page in the other language, for search engines -->
{% unless page.lang_switch == false %}
  {% if page.lang == "en" %}
    {% assign ja_url = page.url | remove_first: "/en" %}
    {% assign en_url = page.url %}
  {% else %}
    {% assign ja_url = page.url %}
    {% assign en_url = page.url | prepend: "/en" %}
  {% endif %}
<link rel="alternate" hreflang="ja" href="{{ base_path }}{{ ja_url }}"/>
<link rel="alternate" hreflang="en" href="{{ base_path }}{{ en_url }}"/>
<link rel="alternate" hreflang="x-default" href="{{ base_path }}{{ ja_url }}"/>
{% endunless %}

<!-- Support for Academicons -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>

<meta name="theme-color" content="#ffffff"/>

<!-- end custom head snippets -->
