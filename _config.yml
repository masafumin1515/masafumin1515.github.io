# Site configuration (academicpages / Minimal Mistakes based).
# This file is NOT reloaded by `jekyll serve`; restart the server after editing it.
# Language-dependent text (bio, menu labels, headings, date formats) lives in _data/i18n.yml.

# Basic site settings
locale                   : "en-US"   # only used for the theme's built-in UI strings (_data/ui-text.yml)
site_theme               : "air"
title                    : "Masafumi Hayashi"
title_separator          : "-"
name                     : "Masafumi Hayashi"
description              : "Masafumi Hayashi's academic portfolio"
url                      : https://masafumin1515.github.io
baseurl                  : ""
repository               : "masafumin1515/masafumin1515.github.io"

# Sidebar profile. The bio and location are taken from _data/i18n.yml per language.
author:
  avatar           : "profile.png"
  name             : "Masafumi Hayashi"
  email            : "masafumi.hayashi@flow.me.es.osaka-u.ac.jp"
  # Uncomment to show a link in the sidebar
  # googlescholar    : "https://scholar.google.com/citations?user=..."
  # orcid            : "https://orcid.org/..."
  # researchgate     : "https://www.researchgate.net/profile/..."
  # github           : "masafumin1515"

# Site settings
teaser                   :
breadcrumbs              : false
words_per_minute         : 160
future                   : true
read_more                : "disabled"
comments:
  provider               : false
atom_feed:
  hide                   : true

# SEO
google_site_verification : "AoQnC6uv1PQDVaN538YdszxO2pkrouAb7nIwkbtfiEE"

# Analytics
analytics:
  provider               : "google-analytics-4"
  google:
    tracking_id          : "G-PBT30RQLTE"

# Reading files
include:
  - _pages
exclude:
  - .devcontainer
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - docker-compose.yaml
  - Dockerfile
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - node_modules
  - package.json
  - README.md
  - vendor
keep_files:
  - .git
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Collections. They are listed on the Publications / Talks / Awards pages and
# have no page of their own (output: false).
collections:
  publications:
    output: false
  talks:
    output: false
  awards:
    output: false

defaults:
  - scope:
      path: ""
    values:
      lang: ja
  - scope:
      path: "_pages/en"
    values:
      lang: en
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

# Sass
sass:
  sass_dir: _sass
  style: compressed

# Outputting
permalink: /:categories/:title/
timezone: Asia/Tokyo

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

whitelist:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

compress_html:
  clippings: all
  ignore:
    envs: development
